<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <g fill="#181717">
    <!-- octopus legs -->
    <g fill="none" stroke="#181717" stroke-width="9" stroke-linecap="round">
      <path d="M34,92 C20,100 44,108 26,122" />
      <path d="M44,95 C34,106 54,110 40,125" />
      <path d="M56,97 C50,109 64,113 54,127" />
      <path d="M72,97 C78,109 64,113 74,127" />
      <path d="M84,95 C94,106 74,110 88,125" />
      <path d="M94,92 C108,100 84,108 102,122" />
    </g>

    <!-- arms -->
    <ellipse cx="21" cy="71" rx="13" ry="8" transform="rotate(-25 21 71)" />
    <ellipse cx="107" cy="71" rx="13" ry="8" transform="rotate(25 107 71)" />

    <!-- torso -->
    <rect x="30" y="54" width="68" height="42" rx="20" />

    <!-- head -->
    <rect x="40" y="18" width="48" height="40" rx="14" />

    <!-- antennae -->
    <line x1="52" y1="19" x2="52" y2="7" stroke="#181717" stroke-width="5" stroke-linecap="round" />
    <circle cx="52" cy="6" r="4.5" />
    <line x1="76" y1="19" x2="76" y2="7" stroke="#181717" stroke-width="5" stroke-linecap="round" />
    <circle cx="76" cy="6" r="4.5" />
  </g>

  <!-- eyes -->
  <circle cx="54" cy="40" r="7.5" fill="#ffffff" />
  <circle cx="74" cy="40" r="7.5" fill="#ffffff" />
  <circle cx="54" cy="40" r="3" fill="#181717" />
  <circle cx="74" cy="40" r="3" fill="#181717" />

  <!-- mouth grille -->
  <rect x="56" y="49" width="16" height="5" rx="2.5" fill="#ffffff" />
</svg>
