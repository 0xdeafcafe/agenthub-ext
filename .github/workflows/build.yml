name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:browser:install -- --with-deps
      - run: npm run test:local
      - run: npm run test:features
      - run: npm run test:pages
      - run: npm run test:visual
      - run: npm run test:extension
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-impact-screenshots-${{ runner.os }}
          path: e2e/screenshots/
          if-no-files-found: ignore

  package:
    needs: test
    strategy:
      matrix:
        browser: [chrome, firefox]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package -- ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        with:
          name: pr-impact-${{ matrix.browser }}
          path: dist/*.zip
          if-no-files-found: error

  safari:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Convert to Safari Xcode project
        run: >-
          xcrun safari-web-extension-converter .output/chrome-mv3
          --project-location safari-out
          --app-name "PR Impact"
          --bundle-identifier com.agenthub.pr-impact
          --swift --force --no-open
      - name: Zip Xcode project
        working-directory: safari-out
        run: zip -r "$GITHUB_WORKSPACE/pr-impact-safari-xcode.zip" "PR Impact"
      - uses: actions/upload-artifact@v4
        with:
          name: pr-impact-safari
          path: pr-impact-safari-xcode.zip
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [package, safari]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pr-impact-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pr-impact-chrome
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: pr-impact-firefox
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: pr-impact-safari
          path: release-assets
      - name: Checksum the downloads
        working-directory: release-assets
        run: sha256sum *.zip > SHA256SUMS
      - name: Publish versioned release or update main build
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
            else
              gh release create "$GITHUB_REF_NAME" release-assets/* \
                --verify-tag --generate-notes --latest
            fi
          else
            # An older run must never overwrite downloads from a newer main commit.
            MAIN_SHA=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
            if [[ "$MAIN_SHA" != "$GITHUB_SHA" ]]; then
              echo 'Main has moved on; skipping this rolling release.'
              exit 0
            fi
            cat > /tmp/release-notes.md <<NOTES
          Built from main at $GITHUB_SHA after Linux and macOS checks passed.

          Arc, Chrome, Edge, Brave: download pr-impact-chrome-mv3.zip, unzip it, and load the folder from your browser's extensions page with Developer mode enabled.
          Firefox: temporary unsigned add-on. Safari: unsigned Xcode project.
          NOTES
            if gh release view rolling >/dev/null 2>&1; then
              gh api --method PATCH "repos/$GH_REPO/git/refs/tags/rolling" \
                -f sha="$GITHUB_SHA" -F force=true
              gh release upload rolling release-assets/* --clobber
              gh release edit rolling --title 'Latest main build' \
                --notes-file /tmp/release-notes.md --prerelease --latest=false
            else
              gh release create rolling release-assets/* --target "$GITHUB_SHA" \
                --title 'Latest main build' --notes-file /tmp/release-notes.md \
                --prerelease --latest=false
            fi
          fi
